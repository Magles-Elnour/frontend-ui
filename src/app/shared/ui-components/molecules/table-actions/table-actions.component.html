<button
  mat-stroked-button
  type="button"
  [routerLink]="editLink()"
  class="table-btn"
>
  <mat-icon> border_color </mat-icon>
</button>
@if (showDelete()) {
  <button
    mat-stroked-button
    type="button"
    class="table-btn ms-2"
    (click)="deleteClick.emit()"
    [attr.aria-label]="deleteLabel() ? (deleteLabel()! | transloco) : null"
  >
    <mat-icon> delete </mat-icon>
  </button>
}
