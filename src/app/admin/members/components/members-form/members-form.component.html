<app-page-header
  [header]="['MEMBERS', isEditMode ? 'MEMBERS_EDIT' : 'MEMBERS_ADD']"
></app-page-header>
<section class="section-card p-3">
  <form [formGroup]="form" (ngSubmit)="addOrUpdate()">
    <div class="p-1 position-relative">
      <app-loading-shade [show]="loading()"></app-loading-shade>
      <div class="row">
        <div
          class="col-12 mb-3 d-flex flex-wrap justify-content-between align-items-center"
        >
          <h2 class="mat-title-large m-0">
            {{ "MEMBER_DETAILS" | transloco }}
          </h2>
        </div>
        <div class="col-12 col-md-6">
          <app-input
            [control]="form.controls.name"
            label="MEMBER_NAME"
            placeholder="LMEMBER_NAME_PLACEHOLDER"
          ></app-input>
        </div>
        <div class="col-12 col-md-6">
          <app-input
            [control]="form.controls.phoneNumber"
            label="PHONE_NUMBER"
            placeholder="PHONE_NUMBER_PLACEHOLDER"
          ></app-input>
        </div>
        <div class="col-12 col-md-6">
          <app-select
            [control]="form.controls.status"
            label="STATUS"
            [options]="statusOptions"
          ></app-select>
        </div>
      </div>
      <button
        mat-flat-button
        [disabled]="form.invalid || loading()"
        type="submit"
      >
        {{
          isEditMode
            ? ("UPDATE_MEMBER_BTN" | transloco)
            : ("ADD_MEMBER_BTN" | transloco)
        }}
        <mat-icon> save </mat-icon>
      </button>
    </div>
  </form>
</section>
