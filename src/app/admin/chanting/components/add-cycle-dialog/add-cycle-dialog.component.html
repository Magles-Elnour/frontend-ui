<div class="dialog-header">
  <h2 mat-dialog-title>{{ "ADD_CYCLE" | transloco }}</h2>
  <button
    mat-icon-button
    type="button"
    mat-dialog-close
    [attr.aria-label]="'CLOSE' | transloco"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <app-input
    [field]="form.number"
    label="CYCLE_NUMBER"
  ></app-input>

  <app-input
    [field]="form.startDate"
    label="CYCLE_START_DATE"
    type="date"
  ></app-input>

  <p class="cycle-explanation">
    {{ "CYCLE_EXPLANATION" | transloco }}
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>
    {{ "CANCEL" | transloco }}
  </button>
  <button
    mat-flat-button
    type="button"
    class="save-button"
    [disabled]="form().invalid() || saving()"
    (click)="save()"
  >
    {{ "SAVE" | transloco }}
  </button>
</mat-dialog-actions>
