<section class="d-flex vh-100">
  <app-loading-shade [show]="userService.isLoading()"></app-loading-shade>
  <div class="h-100 login-section d-flex px-5">
    <form
      class="row py-2 my-auto"
      novalidate
      (submit)="$event.preventDefault(); login()"
    >
      <h1 class="mat-display-small primary-color mb-5">
        {{ "LOGIN_WELCOME" | transloco }}
      </h1>
      <app-input
        class="col-12"
        [field]="loginForm.username"
        label="LOGIN_USERNAME"
        placeholder="LOGIN_USERNAME_PLACEHOLDER"
        autocomplete="username"
        prefixIcon="person"
        floatLabel="always"
      ></app-input>
      <app-input
        class="col-12"
        [field]="loginForm.password"
        label="LOGIN_PASSWORD"
        placeholder="LOGIN_PASSWORD_PLACEHOLDER"
        type="password"
        autocomplete="current-password"
        [hideToggle]="true"
        floatLabel="always"
      ></app-input>

      <div class="d-flex mt-4 justify-content-center">
        <button
          type="submit"
          mat-flat-button
          id="login-submit-btn"
          class="w-100"
          [disabled]="loginForm().invalid() || userService.isLoading()"
        >
          {{ "LOGIN_BTN" | transloco }}
        </button>
      </div>
    </form>
  </div>
  <div class="flex-fill d-flex" style="background-color: #f7f8f7">
    <img
      class="mw-100 mh-100 m-auto"
      src="assets/images/login-2.png"
      alt="Logo"
    />
  </div>
</section>
